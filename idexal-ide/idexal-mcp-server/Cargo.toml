[package]
name = "idexal-mcp-server"
version = "0.1.0"
edition = "2021"
description = "MCP server for Idexal IDE - Code analysis, file operations, and AI tools"
authors = ["Idexal <team@idexal.com>"]
license = "MIT"

[dependencies]
rmcp = { version = "0.8.1", features = ["server"] }
rmcp-macros = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
schemars = { version = "0.8", features = ["derive"] }
async-trait = "0.1"
walkdir = "2"
regex = "1"
similar = "2"
tree-sitter = "0.22"
tree-sitter-rust = "0.22"
tree-sitter-typescript = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-python = "0.21"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[features]
default = []

[[bin]]
name = "idexal-mcp-server"
path = "src/main.rs"