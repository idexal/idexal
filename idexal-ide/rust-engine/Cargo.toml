[package]
name = "idexal-engine"
version = "0.1.0"
edition = "2021"
description = "High-performance backend engine for Idexal IDE"
authors = ["Idexal Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "idexal"
path = "src/bin/idexal_cli.rs"

[dependencies]
napi = { version = "2.12.0", features = ["async"] }
napi-derive = "2.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tree-sitter = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
once_cell = "1.19"
anyhow = "1.0"
async-trait = "0.1"
rayon = "1.8"
parking_lot = "0.12"
dashmap = "5.5"
futures = "0.3"
reqwest = { version = "0.11", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[build-dependencies]
napi-build = "2.1.3"

[profile.release]
lto = "fat"
opt-level = 3
strip = true
codegen-units = 1
panic = "abort"
