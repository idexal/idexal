# Publish Winget Manifests
# Automatically creates and submits winget package manifests when a release is tagged.
# This workflow:
#   1. Waits for the release build to complete
#   2. Downloads the Windows installer
#   3. Generates SHA256 checksum
#   4. Creates winget manifest YAML files
#   5. Submits PR to microsoft/winget-pkgs via wingetcreate

name: Publish to Winget

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., v1.0.0). Leave empty to use latest release.'
        required: false
        type: string

env:
  PACKAGE_ID: Idexal.IdexalIDE
  MANIFEST_VERSION: 1.6.0

jobs:
  publish-winget:
    name: Publish to Winget
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event.inputs.version }}' -ne '') {
            $version = '${{ github.event.inputs.version }}'.TrimStart('v')
          } else {
            $version = '${{ github.event.release.tag_name }}'.TrimStart('v')
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Resolved version: $version"

      - name: Wait for release artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $maxWait = 60  # minutes
          $elapsed = 0

          Write-Host "Waiting for release v$version artifacts..."
          Write-Host "GitHub Release URL: ${{ github.event.release.html_url }}"

          # The release should already exist since this is triggered by release:published
          # But we give it a moment to ensure all assets are uploaded
          Start-Sleep -Seconds 30
          Write-Host "Initial wait complete, proceeding..."

      - name: Download Windows installer
        id: download
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $releaseTag = "v$version"

          Write-Host "Downloading installer for $releaseTag..."

          # Try to find the installer in release assets
          # Common naming patterns:
          #   Idexal-IDE-{version}-Windows-x64.exe (NSIS)
          #   Idexal-IDE-{version}-Windows-x64-Setup.exe
          $patterns = @(
            "Idexal-IDE-$version-Windows-x64.exe",
            "Idexal-IDE-$version-Setup.exe",
            "Idexal-IDE-$version-win-x64.exe"
          )

          # Download via gh CLI
          $assets = gh release view $releaseTag --repo '${{ github.repository }}' --json assets --jq '.assets[].name' 2>$null
          Write-Host "Available assets:"
          Write-Host $assets

          $installer = $null
          foreach ($pattern in $patterns) {
            if ($assets -match [regex]::Escape($pattern)) {
              $installer = $pattern
              break
            }
          }

          # Fallback: find any .exe that looks like an installer
          if (-not $installer) {
            $installer = ($assets -split "`n" | Where-Object { $_ -match '\.exe$' -and $_ -notmatch 'blockmap' -and $_ -match 'Windows' } | Select-Object -First 1)
          }

          if (-not $installer) {
            Write-Error "Could not find Windows installer in release assets"
            Write-Host "Available assets:"
            $assets | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }

          Write-Host "Found installer: $installer"
          gh release download $releaseTag --repo '${{ github.repository }}' --pattern $installer --dir ./installer
          
          $installerPath = Join-Path (Get-Location) "installer" $installer
          Write-Host "Downloaded to: $installerPath"
          Write-Host "EXE_PATH=$installerPath" >> $env:GITHUB_OUTPUT
          Write-Host "EXE_NAME=$installer" >> $env:GITHUB_OUTPUT

      - name: Calculate SHA256 checksum
        id: checksum
        shell: pwsh
        run: |
          $exePath = "${{ steps.download.outputs.EXE_PATH }}"
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $hash"
          echo "HASH=$hash" >> $env:GITHUB_OUTPUT

      - name: Get release info
        id: release
        shell: pwsh
        run: |
          $release = gh release view '${{ github.event.release.tag_name }}' --repo '${{ github.repository }}' --json tagName,name,body,url,publishedAt --jq '.'
          
          $tagName = ($release | ConvertFrom-Json).tagName
          $releaseUrl = ($release | ConvertFrom-Json).url
          $releaseBody = ($release | ConvertFrom-Json).body
          
          echo "RELEASE_URL=$releaseUrl" >> $env:GITHUB_OUTPUT
          echo "RELEASE_BODY<<EOF" >> $env:GITHUB_OUTPUT
          echo "$releaseBody" >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

          Write-Host "Release URL: $releaseUrl"

      - name: Install wingetcreate
        shell: pwsh
        run: |
          Write-Host "Installing wingetcreate..."
          Invoke-WebRequest -Uri 'https://aka.ms/wingetcreate/latest' -OutFile wingetcreate.exe
          .\wingetcreate.exe --version
          
          # Set up winget tools in PATH
          echo "${{ github.workspace }}" >> $env:GITHUB_PATH

      - name: Create winget manifest
        id: manifest
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $exeName = "${{ steps.download.outputs.EXE_NAME }}"
          $hash = "${{ steps.checksum.outputs.HASH }}"
          $releaseUrl = "${{ steps.release.outputs.RELEASE_URL }}"
          $releaseTag = "${{ github.event.release.tag_name }}"
          $installerUrl = "$releaseUrl/download/$releaseTag/$exeName"

          Write-Host "Creating manifest for v$version..."
          Write-Host "Installer URL: $installerUrl"
          Write-Host "SHA256: $hash"

          # Create manifest directory
          $manifestDir = "manifests"
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null

          # Create Version manifest (installer.yaml)
          $versionManifest = @"
`$schema: https://aka.ms/winget-manifest.version.1.6.0.schema.json
PackageIdentifier: ${{ env.PACKAGE_ID }}
PackageVersion: $version
DefaultLocale: en-US
ManifestType: version
ManifestVersion: ${{ env.MANIFEST_VERSION }}
"@

          # Create Installer manifest
          $installerManifest = @"
`$schema: https://aka.ms/winget-manifest.installer.1.6.0.schema.json
PackageIdentifier: ${{ env.PACKAGE_ID }}
PackageVersion: $version
Platform:
- Windows.Desktop
MinimumOSVersion: 10.0.17763.0
InstallerType: nsis
Scope: machine
InstallModes:
- interactive
- silent
- silentWithProgress
InstallerSwitches:
  Silent: /S
  SilentWithProgress: /S
  Custom: /NORESTART
UpgradeBehavior: install
ProductCode: '{2F64C305-63A4-4D5A-8E23-63C208D43B2B}_is1'
Installers:
- Architecture: x64
  InstallerUrl: $installerUrl
  InstallerSha256: $hash
  InstallerLocale: en-US
  ProductCode: '{2F64C305-63A4-4D5A-8E23-63C208D43B2B}_is1'
ManifestType: installer
ManifestVersion: ${{ env.MANIFEST_VERSION }}
"@

          # Create Locale manifest
          $releaseBody = "${{ steps.release.outputs.RELEASE_BODY }}"
          $releaseBody = $releaseBody -replace '"', '\"'

          $localeManifest = @"
`$schema: https://aka.ms/winget-manifest.defaultLocale.1.6.0.schema.json
PackageIdentifier: ${{ env.PACKAGE_ID }}
PackageVersion: $version
PackageLocale: en-US
Publisher: Idexal
PublisherUrl: https://idexal.com
PublisherSupportUrl: https://github.com/idexal/idexal-ide/issues
PrivacyUrl: https://idexal.com/privacy
Author: Zakariae Lahbabi
PackageName: Idexal IDE
PackageUrl: https://idexal.com
License: MIT
LicenseUrl: https://github.com/idexal/idexal-ide/blob/main/LICENSE
ShortDescription: Professional Multi-Agent AI-Powered IDE with 86 panels, 48 slash commands, and 20 AI tools
Description: |
  Idexal IDE is a professional desktop IDE and AI coding assistant that competes with
  VS Code, Cursor, Claude Code, and Codex. Features include:
  
  - 86 IDE panels (editor, terminal, git, database, Docker, K8s, etc.)
  - 48 AI slash commands for coding, review, debugging, testing, and deployment
  - 20 AI-powered tools for reading, writing, editing, and searching files
  - Multi-model support (OpenAI, Anthropic, Ollama, custom providers)
  - Real-time CRDT collaboration
  - Plugin/extension system
  - Cross-platform (Windows, macOS, Linux)
  - Built-in security scanning and performance analysis
Moniker: idexal-ide
Tags:
- ide
- ai
- coding
- editor
- development
- multi-agent
- claude
- openai
- copilot
- vscode
ReleaseNotesUrl: $releaseUrl
ManifestType: defaultLocale
ManifestVersion: ${{ env.MANIFEST_VERSION }}
"@

          # Write manifest files
          Set-Content -Path "$manifestDir/version.yaml" -Value $versionManifest -Encoding UTF8
          Set-Content -Path "$manifestDir/installer.yaml" -Value $installerManifest -Encoding UTF8
          Set-Content -Path "$manifestDir/locale.yaml" -Value $localeManifest -Encoding UTF8

          Write-Host "Manifests created in $manifestDir/:"
          Get-ChildItem $manifestDir | ForEach-Object { Write-Host "  - $($_.Name) ($($_.Length) bytes)" }

          # Display manifests for debugging
          Write-Host "`n--- version.yaml ---"
          Get-Content "$manifestDir/version.yaml" | Write-Host
          Write-Host "`n--- installer.yaml ---"
          Get-Content "$manifestDir/installer.yaml" | Write-Host
          Write-Host "`n--- locale.yaml ---"
          Get-Content "$manifestDir/locale.yaml" | Write-Host

      - name: Submit to winget-pkgs
        if: ${{ github.event_name == 'release' }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $exeName = "${{ steps.download.outputs.EXE_NAME }}"
          $hash = "${{ steps.checksum.outputs.HASH }}"
          $releaseTag = "${{ github.event.release.tag_name }}"
          $releaseUrl = "${{ steps.release.outputs.RELEASE_URL }}"
          $installerUrl = "$releaseUrl/download/$releaseTag/$exeName"

          Write-Host "Submitting to winget-pkgs..."

          # Use wingetcreate to update and submit the manifest
          # This creates a PR to microsoft/winget-pkgs
          .\wingetcreate.exe update `
            --id "${{ env.PACKAGE_ID }}" `
            --version $version `
            --urls $installerUrl `
            --submit `
            --token "${{ secrets.WINGET_PAT }}"

          Write-Host "Manifest submitted to winget-pkgs!"

      - name: Create PR manually (fallback)
        if: ${{ failure() && github.event_name == 'release' }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          Write-Host "wingetcreate submit failed, creating manual PR..."

          # Clone winget-pkgs
          git clone https://x-access-token:${{ secrets.WINGET_PAT }}@github.com/microsoft/winget-pkgs.git winget-pkgs
          cd winget-pkgs

          # Create branch
          $branchName = "Idexal.IdexalIDE-v$version"
          git checkout -b $branchName

          # Create manifest directory structure
          $manifestPath = "manifests/i/Idexal/IdexalIDE/$version"
          New-Item -ItemType Directory -Path $manifestPath -Force | Out-Null

          # Copy manifests
          Copy-Item "../manifests/version.yaml" "$manifestPath/Idexal.IdexalIDE.yaml" -Force
          Copy-Item "../manifests/installer.yaml" "$manifestPath/Idexal.IdexalIDE.installer.yaml" -Force
          Copy-Item "../manifests/locale.yaml" "$manifestPath/Idexal.IdexalIDE.locale.en-US.yaml" -Force

          # Commit and push
          git add .
          git commit -m "Add: Idexal.IdexalIDE v$version"
          git push origin $branchName

          # Create PR
          gh pr create `
            --repo microsoft/winget-pkgs `
            --title "Add: Idexal.IdexalIDE v$version" `
            --body "Automated PR to add Idexal IDE v$version to winget.`n`nRelease: ${{ steps.release.outputs.RELEASE_URL }}" `
            --head $branchName `
            --base master

          Write-Host "Manual PR created!"

      - name: Upload manifest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests-v${{ steps.version.outputs.VERSION }}
          path: manifests/
          retention-days: 90

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          Write-Host "`n========================================="
          Write-Host "  Winget Publishing Summary"
          Write-Host "========================================="
          Write-Host "Package: ${{ env.PACKAGE_ID }}"
          Write-Host "Version: v$version"
          Write-Host "Status: ${{ job.status }}"
          Write-Host ""
          Write-Host "To install:"
          Write-Host "  winget install ${{ env.PACKAGE_ID }}"
          Write-Host ""
          Write-Host "Or upgrade:"
          Write-Host "  winget upgrade ${{ env.PACKAGE_ID }}"
          Write-Host "========================================="
