[package]
name = "idexal-core"
version = "0.1.0"
edition = "2021"
description = "Idexal agent engine — multi-provider, multi-agent orchestration core (Rust)."
license = "MIT"

[[bin]]
name = "idexal-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
