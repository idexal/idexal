[package]
name = "idexal-engine"
version = "0.1.0"
edition = "2021"
description = "High-performance backend engine for Idexal IDE"
authors = ["Idexal Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.12.0", features = ["async"] }
napi-derive = "2.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-python = "0.21"
tree-sitter-go = "0.21"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
anyhow = "1.0"
rayon = "1.8"
parking_lot = "0.12"
dashmap = "5.5"
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[build-dependencies]
napi-build = "2.1.3"

[profile.release]
lto = true
opt-level = 3
strip = true
codegen-units = 1
