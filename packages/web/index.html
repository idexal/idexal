    <title>Idexal</title>
    <script>
      (() => {
        // JS bundle 执行前先按本地主题偏好决定首屏底色，避免 dark 用户在这一帧看到白底闪烁。
        const STORAGE_KEY = "idexal-theme";
        const DEFAULT_THEME = "zai-dark";
        const BROWSER_THEME_COLORS = {
          dark: "#161616",
          light: "#f8f8f8",
        };

        const normalizeResolvedTheme = (theme) => {
          if (theme === "dark") return "dark";
          if (theme === "light") return "light";
          if (theme === "zai-dark") return "dark";
          if (theme === "zai-light") return "light";
          return theme;
        };

        const syncBrowserThemeSurface = (theme) => {
          document.documentElement.setAttribute("data-idexal-browser-theme-surface", theme);
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", BROWSER_THEME_COLORS[theme]);
          document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", theme);
        };

        try {
          const saved = localStorage.getItem(STORAGE_KEY) || DEFAULT_THEME;
          const resolved =
            saved === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : normalizeResolvedTheme(saved);
          const finalTheme = resolved === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-idexal-bootstrap-theme", finalTheme);
          syncBrowserThemeSurface(finalTheme);
          if (finalTheme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          document.documentElement.setAttribute("data-idexal-bootstrap-theme", "dark");
          syncBrowserThemeSurface("dark");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--idexal-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--idexal-bootstrap-fg, var(--color-foreground, #e2e8f0));
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html[data-idexal-bootstrap-theme="light"] body {
        background: var(--idexal-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--idexal-bootstrap-fg, var(--color-foreground, #334155));
      }

      html[data-idexal-browser-theme-surface],
      html[data-idexal-browser-theme-surface] body,
      html[data-idexal-browser-theme-surface] #root {
        /* 共享 UI 样式为 Electron vibrancy 强制透明根背景；浏览器入口必须用语义背景
           覆盖该桌面专属行为，否则浏览器工具栏、overscroll 和页面画布会回退为系统白色。 */
        background: var(--color-background, var(--idexal-bootstrap-bg, #161616)) !important;
      }

      html[data-idexal-browser-theme-surface="light"],
      html[data-idexal-browser-theme-surface="light"] body,
      html[data-idexal-browser-theme-surface="light"] #root {
        background: var(--color-background, var(--idexal-bootstrap-bg, #f8f8f8)) !important;
      }

      .idexal-boot-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        /* UI 全局样式会把 body/#root 置为透明，预渲染壳必须自己承接主题背景，否则深色主题会露出浏览器白底。*/
        background: var(--idexal-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--idexal-bootstrap-fg, var(--color-foreground, #e2e8f0));
      }

      html[data-idexal-bootstrap-theme="light"] .idexal-boot-loading {
        background: var(--idexal-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--idexal-bootstrap-fg, var(--color-foreground, #334155));
      }

      .idexal-boot-loading__logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: linear-gradient(180deg, #000000 0%, #151718 100%);
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.2),
          0 8px 10px -6px rgb(0 0 0 / 0.2);
      }

      .idexal-boot-loading__logo-shell::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        /* 启动 logo 壳是固定深色底，边框不能跟随浅色主题 token，否则首屏边框过重。*/
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
      }

      .idexal-boot-loading__logo {
        width: 56px;
        height: auto;
        object-fit: contain;
        /* 修复：原先是三条旧品牌 Chevron 路径各自错相 <animate>；官方 mark 是单张位图，
           无法再分路径错相，这里退化为整体等节奏脉冲（1.5s、最低 0.3），保持启动动效不消失。 */
        animation: idexal-boot-logo-pulse 1.5s ease-in-out infinite;
      }

      @keyframes idexal-boot-logo-pulse {
        0% {
          opacity: 1;
        }

        50% {
          opacity: 0.3;
        }

        100% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .idexal-boot-loading__logo {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 远程控制跨 workspace 时会整页跳转；在 JS 入口执行前先给出 loading 壳，避免出现白屏空档。-->
      <div
        class="idexal-boot-loading"
        role="status"
        aria-live="polite"
        aria-busy="true"
        aria-label="Loading..."
      >
        <div class="idexal-boot-loading__logo-shell">
          <!--
            修复：React 接管前的预渲染启动壳原先内联上游旧品牌 Chevron 标志，
            与 RootStartupLoading 的品牌图标不一致。logo 壳是固定深色渐变底，
            与页面浅/深主题无关，因此恒定使用深色背景专用（白色）mark。
          -->
          <img
            src="/brand/idexal-mark-dark.png"
            class="idexal-boot-loading__logo"
            alt=""
            aria-hidden="true"
            draggable="false"
          />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
