blank_issues_enabled: false
contact_links:
  - name: Report a security problem
    url: https://github.com/idexal/idexal/security/advisories/new
    about: >
      Please do not open a public issue. Use a private security advisory, or write to
      contact@idexal.com with a subject starting "Idexal security". Read SECURITY.md
      first for what is in scope and what we promise.
  - name: Ask a question or share feedback
    url: https://github.com/idexal/idexal/discussions
    about: >
      How do I…, feature discussion, and "is this supposed to behave like this" all belong
      in Discussions. Issues are for defects and concrete requests.
  - name: Documentation and guides
    url: https://github.com/idexal/idexal/wiki
    about: >
      Install and checksum verification, providers and keys, sign-in status, capabilities,
      privacy, guardrails, troubleshooting.
  - name: Licence, deployment or partnership
    url: mailto:contact@idexal.com
    about: Commercial questions, self-hosted deployment and partnerships.
  - name: Download Idexal
    url: https://github.com/idexal/idexal/releases
    about: Installers, release notes and SHA-256 checksums for every published version.
  - name: Support, diagnostics and what we do not cover
    url: https://github.com/idexal/idexal/blob/main/SUPPORT.md
    about: Where logs live, what to attach, and how to redact before posting.
