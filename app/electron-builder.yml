## Idexal — packaging
##
## What ships: the bundled renderer/main output, the runtime dependencies
## that must stay outside the bundle (a native PTY, ws), and the Rust engine
## as an extra resource. Source and build tooling are deliberately excluded —
## an installed app has no use for TypeScript sources or esbuild.

appId: com.idexal.app
productName: Idexal
copyright: Zakariae Lahbabi

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - package.json
  ## node-pty and ws are marked external in the bundle because they load a
  ## native binary and fork helpers by path; they must exist on disk.
  - node_modules/@lydell/node-pty/**
  - node_modules/@lydell/node-pty-*/**
  - node_modules/ws/**
  - '!**/*.map'
  - '!**/*.ts'

## The engine is a separate binary, not a Node module, so it goes beside the
## app rather than inside the asar: it has to be executable and spawnable.
## resolveCoreBinary() looks here first.
extraResources:
  - from: ../core/target/release/
    to: core
    filter:
      - idexal-core.exe
      - idexal-core

win:
  ## Generated by build/make-icon.py from the same SVG path the UI draws, so
  ## the icon and the in-app mark cannot drift apart.
  icon: build/icon.ico
  target:
    ## nsis installs; portable is a single .exe that needs no install at all,
    ## which matches "free, nothing in the way" better than an installer does.
    - nsis
    - portable

## Both Windows targets emit a .exe, so each needs its OWN name. A shared
## `artifactName` is not a cosmetic problem: the two builds write the same
## path and the second silently overwrites the first, so a release ships one
## file where it promised two. Observed — the portable build replaced the
## installer with no warning.
nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: Idexal

portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}

## x64 only: the engine is a native binary compiled on an x64 runner, and
## an arm64 AppImage carrying an x64 engine would install and then fail to
## run an agent. Better absent than broken.
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
  category: Development

## Built on GitHub's macOS runners, which are Apple Silicon: without an
## explicit arch list the release carried an arm64 .dmg only and every
## Intel Mac got nothing. Both are safe here because the release workflow
## lipo's the engine into a universal binary — a per-arch build alone would
## have put an arm64 engine inside the Intel package. The .icns is produced
## from the PNG by electron-builder there; it cannot be made on Windows.
mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
