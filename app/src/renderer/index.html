<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval';" />
<title>Idexal</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="titlebar">
      <span class="brand">◆ Idexal</span>
      <span class="sub">agentic ide — rust core</span>
    </div>
    <div id="main">
      <div id="editor-pane">
        <div id="monaco-container"></div>
      </div>
      <div id="agent-pane">
        <div id="agent-topbar">
          <span class="badge">idexal-core</span>
          <span class="branch">main</span>
          <span class="spacer"></span>
          <span class="model">Idexal · local</span>
        </div>
        <div id="agent-log"></div>
        <div id="agent-statusbar">
          <span>⎇ main</span>
          <span id="agent-diffstat" class="diffstat"></span>
          <span class="spacer"></span>
          <span id="agent-state" class="state">idle</span>
        </div>
        <div id="agent-input-wrap">
          <div id="agent-input-row">
            <input id="agent-input" type="text" placeholder="صف ما تريد من الوكيل، أو اكتب /…" dir="rtl" />
            <button id="agent-send">إرسال</button>
          </div>
          <div id="agent-input-foot">
            <span class="perm">Local · no account</span>
            <span class="spacer"></span>
            <span class="modelname">Idexal Core</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="vs/loader.js"></script>
  <script>
    require.config({ paths: { vs: 'vs' } });
    require(['vs/editor/editor.main'], function () {
      window.__monaco = monaco;
      window.dispatchEvent(new Event('monaco-ready'));
    });
  </script>
  <script src="index.js"></script>
</body>
</html>
